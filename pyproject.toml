[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "storywheel"
dynamic = ["version"]
description = "Roll a story one piece at a time, keep what clicks, export to markdown."
requires-python = ">=3.9"
dependencies = ["textual>=1.0", "wonderwords>=2.2", "faker", "python-docx>=1.1", "wordfreq>=3.0", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "pytest-timeout", "pyte", "pdfplumber"]

[project.scripts]
storywheel = "storywheel.cli:main"

[tool.setuptools]
packages = ["storywheel"]

[tool.setuptools.dynamic]
version = {attr = "storywheel.__version__"}

[tool.setuptools.package-data]
storywheel = ["data/*.json", "data/*/*.json", "data/*/*/*.json", "data/help/*.md", "nvim/*.lua", "nvim/*/*.lua", "nvim/*/*/*.lua", "nvim/*/*.vim", "fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a hang becomes a failure naming the test (pytest-timeout, in the dev extra); generous, because real-terminal and 200-story tests are slow
timeout = 600
markers = [
    "slow: real terminal, performance, or 200-story fidelity/repetition checks; left out while working (-m 'not slow'), run in the end-of-batch full run",
    "serial: cannot run in parallel (real terminal, shared ports, the hub); the end-of-batch full run runs these in a separate pass without xdist",
]
