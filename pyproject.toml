[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "storywheel"
version = "0.2.0"
description = "Roll a story one piece at a time, keep what clicks, export to markdown."
requires-python = ">=3.9"
dependencies = ["wonderwords>=2.2", "faker"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
storywheel = "storywheel.cli:main"

[tool.setuptools]
packages = ["storywheel"]

[tool.setuptools.package-data]
storywheel = ["data/*.json", "data/*/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
